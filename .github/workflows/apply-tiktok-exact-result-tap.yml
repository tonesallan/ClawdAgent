name: Apply TikTok exact result tap fix

on:
  push:
    branches: [feature/android-tiktok-local]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-tiktok-local
          fetch-depth: 0

      - name: Apply minimal navigation fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/actions/mobile/mobile-agent.ts')
          source = path.read_text(encoding='utf-8')

          old_x = '''            Math.round(
              screen.width / 2,
            ),'''
          new_x = '''            x,'''

          old_comment = '       * Tocamos no centro horizontal real da tela, na mesma linha'
          new_comment = '       * Tocamos no centro horizontal do username, na mesma linha'

          if source.count(old_x) != 1:
              raise SystemExit(f'expected one screen-center expression, found {source.count(old_x)}')
          if source.count(old_comment) != 1:
              raise SystemExit(f'expected one navigation comment, found {source.count(old_comment)}')

          source = source.replace(old_x, new_x)
          source = source.replace(old_comment, new_comment)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/actions/mobile/mobile-agent.ts
          grep -F '            x,' src/actions/mobile/mobile-agent.ts
          rm .github/workflows/apply-tiktok-exact-result-tap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/actions/mobile/mobile-agent.ts .github/workflows/apply-tiktok-exact-result-tap.yml
          git commit -m 'fix(tiktok): tap exact username result coordinates'
          git push origin HEAD:feature/android-tiktok-local
